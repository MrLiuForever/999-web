name: Publish web game to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing 999-Web-Pages.zip
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the prepared web game
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p package site
          gh release download "$RELEASE_TAG" --pattern '999-Web-Pages.zip' --dir package
          unzip -q package/999-Web-Pages.zip -d site
          test -f site/index.html
          test -f site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
